name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Notes de version depuis le changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p=($2==v)} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version $v" > notes.md
      - name: Publier
        run: gh release create "$GITHUB_REF_NAME" --title "PLAN SOCIAL $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
